# gz_bridge.yaml — ros_gz_bridge topic mapping for ShelfBot
#
# Format: ros_topic_name@ros_msg_type[gz_msg_type
#   [  = subscribe from Gz, publish to ROS
#   ]  = subscribe from ROS, publish to Gz
#   @  = bidirectional

# ── Drive command (ROS → Gazebo) ──────────────────────────────────────────────
- ros_topic_name: /cmd_vel
  gz_topic_name:  /cmd_vel
  ros_type_name:  geometry_msgs/msg/Twist
  gz_type_name:   gz.msgs.Twist
  direction:      ROS_TO_GZ

# ── Odometry (Gazebo → ROS) ───────────────────────────────────────────────────
- ros_topic_name: /odom
  gz_topic_name:  /odom
  ros_type_name:  nav_msgs/msg/Odometry
  gz_type_name:   gz.msgs.Odometry
  direction:      GZ_TO_ROS

# ── TF (Gazebo → ROS) — wheel odometry TF from diff drive ────────────────────
- ros_topic_name: /tf
  gz_topic_name:  /tf
  ros_type_name:  tf2_msgs/msg/TFMessage
  gz_type_name:   gz.msgs.Pose_V
  direction:      GZ_TO_ROS

# ── Joint states (Gazebo → ROS) ───────────────────────────────────────────────
- ros_topic_name: /joint_states
  gz_topic_name:  /joint_states
  ros_type_name:  sensor_msgs/msg/JointState
  gz_type_name:   gz.msgs.Model
  direction:      GZ_TO_ROS

# ── IMU (Gazebo → ROS) ────────────────────────────────────────────────────────
- ros_topic_name: /imu/data
  gz_topic_name:  /imu/data
  ros_type_name:  sensor_msgs/msg/Imu
  gz_type_name:   gz.msgs.IMU
  direction:      GZ_TO_ROS

# ── Simulation clock (Gazebo → ROS) ──────────────────────────────────────────
- ros_topic_name: /clock
  gz_topic_name:  /clock
  ros_type_name:  rosgraph_msgs/msg/Clock
  gz_type_name:   gz.msgs.Clock
  direction:      GZ_TO_ROS

# ── Camera image (Gazebo → ROS) ───────────────────────────────────────────────
- ros_topic_name: /camera/image_raw
  gz_topic_name:  /camera/image
  ros_type_name:  sensor_msgs/msg/Image
  gz_type_name:   gz.msgs.Image
  direction:      GZ_TO_ROS

# ── Camera depth (Gazebo → ROS) ───────────────────────────────────────────────
- ros_topic_name: /camera/depth_image
  gz_topic_name:  /camera/depth_image
  ros_type_name:  sensor_msgs/msg/Image
  gz_type_name:   gz.msgs.Image
  direction:      GZ_TO_ROS
